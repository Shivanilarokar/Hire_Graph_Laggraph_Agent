[project]
name = "hiregraph"
version = "0.1.0"
description = "HireGraph - a production-grade LangGraph smart hiring assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- LangGraph core ---
    "langgraph>=0.3.0",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-redis>=0.0.5",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    # --- Tools / services ---
    "tavily-python>=0.5.0",
    "pymupdf>=1.24.0",
    "httpx>=0.27.0",
    # --- Config / util ---
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    # --- API ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # --- Telemetry ---
    "langsmith>=0.1.120",
]

[project.scripts]
hiregraph = "hiregraph.cli:main"
hiregraph-resume = "hiregraph.resume_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiregraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
